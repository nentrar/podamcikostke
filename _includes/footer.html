<script>
(function () {
  const toggle = document.querySelector('.menu-toggle');
  const links = document.querySelector('.nav-links');
  if (toggle && links) toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    links.classList.toggle('is-open', !open);
  });
})();
async function loadDownloadCounts() {
  const btns = document.querySelectorAll('[data-scenario]');
  for (const btn of btns) {
    const scenario = btn.dataset.scenario;
    try {
      const res = await fetch(`/api/download-count?scenario=${scenario}`);
      const { count } = await res.json();
      const el = document.getElementById(`count-${scenario}`);
      if (el && count > 0) el.textContent = `Pobrano ${count} razy`;
    } catch (e) {}
  }
}
async function trackDownload(scenario) {
  try { await fetch(`/api/download-count?scenario=${scenario}&action=increment`); } catch (e) {}
}
loadDownloadCounts();
</script>
